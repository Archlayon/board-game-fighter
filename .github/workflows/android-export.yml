name: Android Export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
          mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.2.stable/templates

      - name: Setup debug keystore
        if: env.ANDROID_DEBUG_KEYSTORE != ''
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          echo "$ANDROID_DEBUG_KEYSTORE" | base64 -d > debug.keystore
          echo "Using custom debug keystore for consistent signing"

      - name: Fallback keystore warning
        if: env.ANDROID_DEBUG_KEYSTORE == ''
        run: |
          echo "⚠️ ANDROID_DEBUG_KEYSTORE secret not set - using default debug keystore"
          echo "   APKs will NOT be installable as updates without uninstalling first!"
          echo "   Add ANDROID_DEBUG_KEYSTORE secret in GitHub repo settings to fix this."

      - name: Setup export preset
        run: |
          cp export_presets.cfg.example export_presets.cfg
          # Update version code to GitHub run number for auto-increment
          sed -i "s/version\/code=1/version\/code=${{ github.run_number }}/" export_presets.cfg
          # Use our consistent debug keystore
          if [ -f debug.keystore ]; then
            sed -i "s|package/signed=true|package/signed=true\npackage/debug_keystore=\"debug.keystore\"\npackage/debug_keystore_user=\"androiddebugkey\"\npackage/debug_keystore_pass=\"android\"\npackage/debug_key_pass=\"android\"|" export_presets.cfg
          fi

      - name: Setup CI project config
        run: cp project.ci.godot project.godot

      - name: Import assets
        run: ./godot --headless --import

      - name: Export Android Debug APK
        run: |
          mkdir -p exports
          ./godot --headless --export-debug "Android Debug" exports/BoardGameFighter-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoardGameFighter-debug
          path: exports/BoardGameFighter-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Board Game Fighter - Build ${{ github.run_number }}"
          body: |
            Development build for testing.
            
            **Installation:**
            1. Download `BoardGameFighter-debug.apk`
            2. Enable "Install unknown apps" for your browser/file manager
            3. Open the APK and install
            
            Package ID: `com.layon.boardgamefighter`
            Version code: ${{ github.run_number }}
          files: exports/BoardGameFighter-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}