name: Android Export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
          mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.2.stable/templates

      - name: Setup export preset
        run: cp export_presets.cfg.example export_presets.cfg

      - name: Setup CI project config
        run: cp project.ci.godot project.godot

      - name: Import assets
        run: ./godot --headless --import

      - name: Export Android Debug APK
        run: |
          mkdir -p exports
          ./godot --headless --export-debug "Android Debug" exports/BoardGameFighter-debug.apk || true

      - name: Verify APK
        run: |
          ls -la exports/
          test -f exports/BoardGameFighter-debug.apk && echo "APK created successfully" || (echo "APK not found" && exit 1)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoardGameFighter-debug
          path: exports/BoardGameFighter-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Board Game Fighter - Build ${{ github.run_number }}"
          body: |
            Development build for testing.
            
            **Installation:**
            1. Download `BoardGameFighter-debug.apk`
            2. Enable "Install unknown apps" for your browser/file manager
            3. Open the APK and install
            
            Package ID: `com.layon.boardgamefighter`
            Version: ${{ github.run_number }}
          files: exports/BoardGameFighter-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}